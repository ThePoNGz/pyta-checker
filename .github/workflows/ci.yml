name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "server[dev]"
      - run: python -m pytest server/tests -q

  node:
    name: extension unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  bundle-min:
    # The bundle is built and exercised on 3.13 everywhere else, but the server
    # supports 3.10, so bundled syntax or metadata could break the oldest users
    # without anything noticing.
    name: bundle on minimum Python
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build bundled libs
        run: python scripts/bundle.py build
      - name: Server tarball starts from an unrelated directory
        run: |
          python scripts/bundle.py tarball dist
          python scripts/bundle.py check-tarball dist/pyta-lsp-server-*.tar.gz
      - name: Python tests against the bundle only (no python-ta installed)
        run: |
          python -m venv .venv-bare
          .venv-bare/bin/python -m pip install --quiet pytest pytest-asyncio packaging
          .venv-bare/bin/python -m pip install --quiet --no-deps pytest-lsp
          PYTHONPATH="$PWD/bundled/libs" .venv-bare/bin/python -m pytest server/tests -q -p no:cacheprovider

  bundle-max:
    # bundle-min guards the oldest supported Python, this one guards the newest.
    name: bundle on newest Python
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build bundled libs
        run: python scripts/bundle.py build
      - name: Server tarball starts from an unrelated directory
        run: |
          python scripts/bundle.py tarball dist
          python scripts/bundle.py check-tarball dist/pyta-lsp-server-*.tar.gz
      - name: Python tests against the bundle only (no python-ta installed)
        run: |
          python -m venv .venv-bare
          .venv-bare/bin/python -m pip install --quiet pytest pytest-asyncio packaging
          .venv-bare/bin/python -m pip install --quiet --no-deps pytest-lsp
          PYTHONPATH="$PWD/bundled/libs" .venv-bare/bin/python -m pytest server/tests -q -p no:cacheprovider

  bundle:
    name: bundle + integration (${{ matrix.os }})
    needs: [python, node]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build bundled libs
        run: python scripts/bundle.py build
      - name: Server tarball starts from an unrelated directory
        shell: bash
        run: |
          python scripts/bundle.py tarball dist
          python scripts/bundle.py check-tarball dist/pyta-lsp-server-*.tar.gz
      - name: Python tests against the bundle only (no python-ta installed)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv-bare
          .venv-bare/bin/python -m pip install --quiet pytest pytest-asyncio packaging
          .venv-bare/bin/python -m pip install --quiet --no-deps pytest-lsp
          PYTHONPATH="$PWD/bundled/libs" .venv-bare/bin/python -m pytest server/tests -q -p no:cacheprovider
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Package VSIX
        if: runner.os == 'Linux'
        run: |
          npm run build:prod
          npx @vscode/vsce package --no-dependencies -o pyta-checker.vsix
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: pyta-checker-vsix
          path: pyta-checker.vsix

  zed:
    name: zed extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32-wasip2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            zed/target
          key: cargo-${{ runner.os }}-${{ hashFiles('zed/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --manifest-path zed/Cargo.toml --check
      - run: cargo clippy --manifest-path zed/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path zed/Cargo.toml
      - run: cargo build --manifest-path zed/Cargo.toml --release --target wasm32-wasip2
